name: Validate & Build GeoJSON Index

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Node.js Umgebung einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # 3. AJV-CLI installieren (für JSON-Schema Validierung)
      - name: Install Validation Tools
        run: npm install -g ajv-cli ajv-formats

      # 4. Alle einzelnen JSON-Dateien gegen das Schema prüfen
      - name: Validate Building JSONs against Schema
        run: |
          npx ajv validate -s schema/building.schema.json -d "data/buildings/*.json" --strict=false
